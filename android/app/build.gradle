plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.kaia.meshvpn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kaia.meshvpn'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.2.0-ui'
        ndk { abiFilters 'arm64-v8a' }
        // S4: alléger mergeDebugResources
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
    }

    // S5 : pas de jvmToolchain (le runner CI n'a pas de JDK17 détectable par toolchain)


    // S4 anti-OOM: desactiver crunch png, legacy packaging
    aaptOptions {
        cruncherEnabled = false
    }

    // libmeshd.so doit être extrait dans nativeLibraryDir pour être copié puis exécuté
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            doNotStrip "**/libmeshd.so"
            keepDebugSymbols += ["**/libmeshd.so"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
            crunchPngs false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // UI déclarative
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}
