plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kaia.meshvpn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kaia.meshvpn'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // Only ship the native meshd daemon we actually build in CI.
        ndk { abiFilters 'arm64-v8a' }
    }

    // Keep the cross-compiled Go daemon (libmeshd.so) uncompressed and page
    // aligned so it can be executed straight from the APK on Android 6+.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
