plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kaia.meshvpn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kaia.meshvpn'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.1.1-fix-crash'
        ndk { abiFilters 'arm64-v8a' }
        // S4: alléger mergeDebugResources
        resourceConfigurations += ['en']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // S4 anti-OOM: desactiver crunch png, legacy packaging
    aaptOptions {
        cruncherEnabled = false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            doNotStrip "**/libmeshd.so"
            keepDebugSymbols += ["**/libmeshd.so"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
            crunchPngs false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
