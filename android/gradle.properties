# Mémoire JVM du daemon Gradle : marge confortable pour R8/D8 (dex merging).
# L'ancienne valeur -Xmx384m provoquait java.lang.OutOfMemoryError: Java heap space
# dans DexMergingTaskDelegate / com.android.tools.r8 (run 43617043909).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.experimental.enableArtProfiles=false
android.enableR8.fullMode=false
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
