name: Android APK (with meshd arm64-v8a)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build meshd arm64 + assemble APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android SDK (ANDROID_HOME / ANDROID_SDK_ROOT / default paths)
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          # The ubuntu-latest image sometimes exports only ANDROID_HOME, sometimes
          # neither: fall back to the well-known image location.
          SDK=""
          for c in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk" \
                   "/usr/local/lib/android/sdk" "/opt/android-sdk"; do
            if [ -n "$c" ] && [ -d "$c" ] && [ -d "$c/platform-tools" -o -d "$c/cmdline-tools" -o -d "$c/licenses" ]; then
              SDK="$c"; break
            fi
          done
          if [ -z "$SDK" ]; then
            echo "::error::no usable Android SDK found (tried ANDROID_HOME, ANDROID_SDK_ROOT, $HOME/Android/Sdk, /usr/local/lib/android/sdk, /opt/android-sdk)"
            exit 1
          fi
          echo "Using Android SDK at: $SDK"
          ls "$SDK" | head -20
          # Export for the whole job AND write sdk.dir for Gradle.
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          cat android/local.properties

      - name: Cross-compile meshd for arm64-v8a (CGO disabled, pure Go)
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o android/app/src/main/jniLibs/arm64-v8a/libmeshd.so ./cmd/meshd
          # The packaged libmeshd.so is the ONLY exec location on device
          # (nativeLibraryDir). Its exact bytes must be the ones we just built.
          ( cd android/app/src/main/jniLibs/arm64-v8a && sha256sum libmeshd.so | tee libmeshd.so.sha256 )

      - name: Assert meshd arm64 binary is non-empty and correctly typed
        run: |
          set -euo pipefail
          BIN=android/app/src/main/jniLibs/arm64-v8a/libmeshd.so
          test -f "$BIN" || { echo "::error::meshd arm64 binary missing"; exit 1; }
          SIZE=$(stat -c%s "$BIN")
          echo "meshd arm64-v8a size = $SIZE bytes"
          test "$SIZE" -gt 1000000 || { echo "::error::binary suspiciously small ($SIZE)"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q 'ARM aarch64' || { echo "::error::not an aarch64 ELF"; exit 1; }
          echo "meshd_arm64_size=$SIZE" >> "$GITHUB_ENV"

      - name: Setup Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Set up Gradle cache from wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Do NOT specify gradle-version: use the wrapper committed at
          # android/gradle/wrapper/gradle-wrapper.properties (8.7) to avoid
          # cold resolution without lock. AGP 8.5.2 plugin resolves from
          # google() first (settings.gradle pluginManagement order fixed).

      - name: Verify runner memory headroom for R8/D8
        run: |
          set -euo pipefail
          free -m || true
          nproc || true
          grep -E '^org\.gradle\.jvmargs' android/gradle.properties

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee /tmp/gradle-build.log
          echo "---- gradle build tail ----"
          tail -200 /tmp/gradle-build.log || true

      - name: Assert meshd is packaged inside the APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          test -n "$APK" || { echo "::error::no debug APK produced"; exit 1; }
          ls -l "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          # Exact entry check (plain grep -F: no ERE escaping trap), and only the
          # fresh jniLibs copy is accepted (jniLibs.bak is git-ignored).
          grep -F -q 'lib/arm64-v8a/libmeshd.so' /tmp/apk-contents.txt \
            || { echo "::error::meshd not packaged in the APK"; exit 1; }
          # Robust check: Python zipfile gives real uncompressed sizes. Parsing
          # `zipinfo -l` / `unzip -lv` text columns was the fragile part that made
          # earlier runs fail on a perfectly valid APK.
          python3 .github/scripts/assert_apk_meshd.py "$APK" | tee /tmp/apk-assert.log
          UNPACKED=$(grep -oP 'meshd inside APK = \K[0-9]+' /tmp/apk-assert.log | head -1)
          UNPACKED=$(echo "$UNPACKED" | tr -dc '0-9')
          echo "meshd inside APK = $UNPACKED bytes"
          test -n "$UNPACKED" || { echo "::error::could not read meshd size from APK listing"; exit 1; }
          test "$UNPACKED" -gt 1000000 || { echo "::error::packaged meshd too small ($UNPACKED)"; exit 1; }

          # ---- Integrity assertion: the .so INSIDE the APK is byte-for-byte the
          # ---- binary we just cross-compiled. Without this, an APK could ship an
          # ---- old/stale libmeshd.so and the app would still fail on device.
          unzip -p "$APK" lib/arm64-v8a/libmeshd.so > /tmp/meshd_from_apk.so
          SHA_APK=$(sha256sum /tmp/meshd_from_apk.so | cut -d' ' -f1)
          SHA_BUILT=$(sha256sum android/app/src/main/jniLibs/arm64-v8a/libmeshd.so | cut -d' ' -f1)
          echo "sha256 built  = $SHA_BUILT"
          echo "sha256 in APK = $SHA_APK"
          test "$SHA_APK" = "$SHA_BUILT" || {
            echo "::error::sha256 mismatch: libmeshd.so inside the APK differs from the freshly built binary"
            exit 1
          }
          echo "::notice::sha256 OK - APK ships the freshly built meshd arm64-v8a ($SHA_BUILT)"

          {
            echo "### Android build proof"
            echo ""
            echo "- meshd arm64-v8a (standalone): **${{ env.meshd_arm64_size }} bytes**"
            echo "- meshd packaged in APK: **$UNPACKED bytes**"
            echo "- sha256 (built == packaged): \`$SHA_BUILT\`"
            echo "- exec location enforced on device: \`applicationInfo.nativeLibraryDir/libmeshd.so\`"
            echo "- APK: \`$(basename "$APK")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaia-mesh-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload standalone meshd arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: meshd-arm64-v8a
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libmeshd.so
            android/app/src/main/jniLibs/arm64-v8a/libmeshd.so.sha256
