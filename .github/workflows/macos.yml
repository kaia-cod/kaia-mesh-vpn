name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.arch == 'arm64' && 'macos-latest' || 'macos-13' }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-latest' || 'macos-13' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: go vet
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      - name: go test ./...
        env:
          CGO_ENABLED: 0
        run: go test ./... -count=1

      - name: Build meshd (darwin/${{ matrix.arch }})
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o meshd-darwin-${{ matrix.arch }} ./cmd/meshd
          ls -la meshd-darwin-${{ matrix.arch }}
          file meshd-darwin-${{ matrix.arch }}

      - name: Smoke run (prints node id and exits)
        env:
          CGO_ENABLED: 0
        run: |
          ./meshd-darwin-${{ matrix.arch }} --help > help-${{ matrix.arch }}.txt 2>&1 || true
          head -40 help-${{ matrix.arch }}.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kaia-mesh-darwin-${{ matrix.arch }}
          path: |
            meshd-darwin-${{ matrix.arch }}
            help-${{ matrix.arch }}.txt
